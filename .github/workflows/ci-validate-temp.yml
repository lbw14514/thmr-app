name: THMR Temp Validate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          package-manager-cache: false
      - run: node --test tool/test_update_release.cjs
